<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的信用卡管家</title>
    <!-- 引入 Tailwind CSS 负责美化样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons 负责图标 -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-4 md:p-8 font-sans min-h-screen">
    
    <div class="max-w-5xl mx-auto space-y-8" id="app">
        <!-- 页面内容将通过下面的脚本自动生成在这里 -->
    </div>

    <script>
        // 原始信用卡数据
        const initialCards = [
            { id: 'minsheng', bank: '民生银行', initial: '民', billDay: 21, payDay: 10, limit: 50000, tempLimit: 0, theme: 'from-teal-500 to-emerald-700', logoText: 'CMBC' },
            { id: 'bocom', bank: '交通银行', initial: '交', billDay: 21, payDay: 15, limit: 30000, tempLimit: 0, theme: 'from-blue-700 to-blue-900', logoText: 'BOCOM' },
            { id: 'spdb', bank: '浦发银行', initial: '浦', billDay: 24, payDay: 13, limit: 43000, tempLimit: 0, theme: 'from-indigo-500 to-purple-700', logoText: 'SPDB' },
            { id: 'cmb', bank: '招商银行', initial: '招', billDay: 25, payDay: 13, limit: 50000, tempLimit: 110000, theme: 'from-red-500 to-rose-700', logoText: 'CMB' }
        ];

        // 格式化金额
        const formatMoney = (num) => num.toLocaleString('zh-CN');

        // 计算日期和状态的核心逻辑
        const calculateCardStatus = (billDay, payDay) => {
            const today = new Date();
            today.setHours(0, 0, 0, 0); 
            
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth(); 
            const currentDate = today.getDate();

            let statusType = "";
            let targetDate = new Date();
            let isUrgent = false;

            if (currentDate <= payDay) {
                // 待还款期
                statusType = "repayment";
                targetDate = new Date(currentYear, currentMonth, payDay);
                isUrgent = ((targetDate - today) / (1000 * 60 * 60 * 24)) <= 5;
            } else if (currentDate > payDay && currentDate <= billDay) {
                // 未出账的安全期
                statusType = "billing";
                targetDate = new Date(currentYear, currentMonth, billDay);
            } else {
                // 已出账，待下月还款
                statusType = "repayment";
                targetDate = new Date(currentYear, currentMonth + 1, payDay);
                isUrgent = false;
            }

            const daysLeft = Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));
            
            return {
                statusType,
                daysLeft,
                targetDateStr: `${targetDate.getMonth() + 1}月${targetDate.getDate()}日`,
                isUrgent
            };
        };

        // 渲染页面的主函数
        function renderApp() {
            const totalBaseLimit = initialCards.reduce((sum, card) => sum + card.limit, 0);
            const totalTempLimit = initialCards.reduce((sum, card) => sum + card.tempLimit, 0);
            const todayStr = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

            let html = `
                <header class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 tracking-tight flex items-center gap-2">
                            <i data-lucide="wallet" class="text-blue-600 w-8 h-8"></i>
                            我的信用卡管家
                        </h1>
                        <p class="text-gray-500 mt-1 flex items-center gap-1">
                            <i data-lucide="calendar-days" class="w-4 h-4"></i>
                            今天是 ${todayStr}
                        </p>
                    </div>

                    <div class="bg-white px-6 py-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-6">
                        <div>
                            <p class="text-sm text-gray-500 mb-1">总固定额度</p>
                            <p class="text-2xl font-bold text-gray-800">¥ ${formatMoney(totalBaseLimit)}</p>
                        </div>
                        ${totalTempLimit > 0 ? `
                        <div class="pl-6 border-l border-gray-100">
                            <p class="text-sm text-gray-500 mb-1">总临时额度</p>
                            <p class="text-2xl font-bold text-orange-500">¥ ${formatMoney(totalTempLimit)}</p>
                        </div>` : ''}
                    </div>
                </header>
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-6 mt-8">
            `;

            initialCards.forEach(card => {
                const status = calculateCardStatus(card.billDay, card.payDay);
                const isRepayment = status.statusType === 'repayment';
                
                // 根据状态决定颜色
                let statusBgClass = isRepayment && status.isUrgent ? 'bg-red-50 border-red-100' : (isRepayment ? 'bg-orange-50 border-orange-100' : 'bg-green-50 border-green-100');
                let iconClass = isRepayment && status.isUrgent ? 'text-red-500' : (isRepayment ? 'text-orange-500' : 'text-green-500');
                let iconName = isRepayment && status.isUrgent ? 'alert-circle' : (isRepayment ? 'info' : 'check-circle-2');
                let textClass = isRepayment && status.isUrgent ? 'text-red-700' : (isRepayment ? 'text-orange-700' : 'text-green-700');
                let numberClass = isRepayment && status.isUrgent ? 'text-red-600' : (isRepayment ? 'text-orange-600' : 'text-green-600');

                html += `
                <div class="group relative rounded-3xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 bg-white border border-gray-100 flex flex-col">
                    <div class="p-6 pb-8 bg-gradient-to-br ${card.theme} text-white relative">
                        <div class="absolute top-0 right-0 p-6 opacity-20 transform translate-x-4 -translate-y-4">
                            <i data-lucide="credit-card" class="w-32 h-32"></i>
                        </div>
                        <div class="flex justify-between items-start relative z-10">
                            <div class="flex items-center gap-2">
                                <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center font-bold text-white shadow-inner">
                                    ${card.initial}
                                </div>
                                <span class="text-xl font-medium tracking-wider">${card.bank}</span>
                            </div>
                            <span class="text-sm font-semibold tracking-widest bg-black/20 px-3 py-1 rounded-full">${card.logoText}</span>
                        </div>

                        <div class="mt-8 relative z-10">
                            <p class="text-sm text-white/70 mb-1">信用额度 (¥)</p>
                            <div class="flex items-end gap-3">
                                <p class="text-4xl font-bold tracking-tight">${formatMoney(card.limit)}</p>
                                ${card.tempLimit > 0 ? `<span class="bg-orange-500/90 text-white text-xs px-2 py-1 rounded-md font-medium flex items-center gap-1 mb-1 shadow-sm">临 +${formatMoney(card.tempLimit)}</span>` : ''}
                            </div>
                        </div>

                        <div class="mt-8 flex justify-between text-sm text-white/80 relative z-10">
                            <div>
                                <span class="uppercase text-xs opacity-70 block mb-1">账单日</span>
                                <span class="font-medium text-base">每月 ${card.billDay} 日</span>
                            </div>
                            <div class="text-right">
                                <span class="uppercase text-xs opacity-70 block mb-1">还款日</span>
                                <span class="font-medium text-base">每月 ${card.payDay} 日</span>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-white flex-1 flex flex-col justify-center">
                        <div class="flex items-center justify-between p-3 rounded-xl border ${statusBgClass}">
                            <div class="flex items-center gap-3">
                                <i data-lucide="${iconName}" class="${iconClass} w-6 h-6"></i>
                                <div>
                                    <p class="font-medium ${textClass}">
                                        ${isRepayment ? '距离还款日还有' : '距离下期账单还有'}
                                    </p>
                                    <p class="text-xs text-gray-500 mt-0.5">
                                        目标日期: ${status.targetDateStr}
                                    </p>
                                </div>
                            </div>
                            <div class="text-3xl font-bold ${numberClass}">
                                ${status.daysLeft} <span class="text-sm font-normal">天</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            html += `</div>
            <div class="text-center text-sm text-gray-400 mt-8 pb-8">
                <p>温馨提示：数据计算基于当前设备本地日期。</p>
            </div>`;

            document.getElementById('app').innerHTML = html;
            
            // 初始化图标
            lucide.createIcons();
        }

        // 执行渲染
        renderApp();
    </script>
</body>
</html>
